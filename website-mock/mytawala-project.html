<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tawala - Project Details</title>
  <link rel="stylesheet" href="css/legacy/tawala-base.css" />
  <link rel="stylesheet" href="css/legacy/pages/library.css" />
  <link rel="stylesheet" href="css/tawala-chrome.css?v=20260810-makecopy1" />
  <script src="js/demo-urls.js?v=20260810-makecopy1"></script>
  <script src="js/transfer.js?v=20260810-makecopy1"></script>
  <script src="js/project-ops.js?v=20260810-makecopy1"></script>
  <script src="js/data-ops.js?v=20260810-makecopy1"></script>
</head>
<body data-tawala-page="mytawala" data-tawala-user="dev">
  <div id="doc">
    <div id="tawala-chrome-banner"></div>
    <div id="tawala-chrome-header"></div>

    <div id="bd" class="pm-detail-bd">
      <div class="content pm-detail-content">
        <div id="pmDetailHost"></div>
      </div>
    </div>

    <div id="tawala-chrome-footer"></div>
  </div>

  <script src="js/chrome.js?v=20260810-makecopy1"></script>
  <script>
    TawalaChrome.mount();
    TawalaProjectOps.bind(document);

    let ingested = null;
    if (typeof TawalaTransfer !== "undefined") {
      ingested = TawalaTransfer.ingestDeployReceiptFromUrl(location.search);
    }

    const params = new URLSearchParams(location.search);
    const id =
      params.get("project") ||
      (ingested && ingested.id) ||
      (ingested && ingested.name && typeof TawalaTransfer !== "undefined"
        ? TawalaTransfer.slugifyProjectId(ingested.name)
        : "") ||
      "";

    function renderProject(projectId, opts) {
      const project = projectId ? TawalaDemo.getMyTawala(projectId) : null;
      const host = document.getElementById("pmDetailHost");
      if (!project) {
        const lib = projectId ? TawalaDemo.getLibrary(projectId) : null;
        if (lib) {
          location.replace("library-detail.html?project=" + encodeURIComponent(projectId));
        } else {
          host.innerHTML =
            '<p class="pm-hint">Unknown project' +
            (projectId ? " (“" + projectId.replace(/</g, "&lt;") + "”)" : "") +
            '. Deploy from Web Designer and use <b>Show in My Tawala</b>, or <a href="mytawala.html">← Back to My Tawala</a>.</p>';
        }
        return;
      }
      document.title = "Tawala - " + TawalaDemo.displayName(project.name);
      host.innerHTML = TawalaProjectOps.renderDetailPanel(
        { id: projectId, ...project },
        opts || {}
      );
      if (typeof TawalaProjectOps.syncDeployVersionChip === "function") {
        TawalaProjectOps.syncDeployVersionChip(host);
      }
      if (typeof TawalaProjectOps.syncProjectActionsForDataSelection === "function") {
        TawalaProjectOps.syncProjectActionsForDataSelection(host.querySelector("#pmDataTree"));
      }
      if (typeof TawalaProjectOps.applyOpenStartsEntry === "function") {
        TawalaProjectOps.applyOpenStartsEntry(host.querySelector("#pmDataTree"));
      }
      if (typeof TawalaProjectOps.hydrateProjectDataTree === "function") {
        void TawalaProjectOps.hydrateProjectDataTree(host);
      }
      if (typeof TawalaProjectOps.hydrateThemeFromProjectJson === "function") {
        void TawalaProjectOps.hydrateThemeFromProjectJson(host, {
          id: projectId,
          ...project,
        });
      }
    }

    const justAcquired = params.get("acquired") === "1";
    renderProject(id, { justAcquired });
    if (justAcquired && id) {
      try {
        history.replaceState(
          {},
          "",
          "mytawala-project.html?project=" + encodeURIComponent(id)
        );
      } catch {
        /* ignore */
      }
      const status = document.getElementById("pmOpStatus");
      if (status) {
        status.textContent =
          "Saved a copy — Use stays grey until Deploy. Sort My Tawala by Created to find this row.";
      }
    }

    /* Left-rail identity: re-paint after Publish / Active / Rename without a full navigation. */
    document.addEventListener("tawala:project-published", () => {
      if (id) renderProject(id);
    });
    document.addEventListener("tawala:project-active-changed", () => {
      if (id) renderProject(id);
    });
    document.addEventListener("tawala:project-renamed", () => {
      if (id) renderProject(id);
    });
    document.addEventListener("tawala:project-description-changed", () => {
      if (id) renderProject(id);
    });

    /* After Purge / Import / Restore — refresh Records totals + per-form counts in Project Data. */
    function refreshProjectDataCounts() {
      const host = document.getElementById("pmDetailHost");
      if (host && typeof TawalaProjectOps.hydrateProjectDataTree === "function") {
        void TawalaProjectOps.hydrateProjectDataTree(host);
      }
    }
    document.addEventListener("tawala:project-purged", refreshProjectDataCounts);
    document.addEventListener("tawala:project-imported", refreshProjectDataCounts);
    document.addEventListener("tawala:project-restored", refreshProjectDataCounts);

    /* Hydrate definition body from :3001 snapshot so Deploy-this-version works offline of a re-fetch later. */
    (async function hydrateSnapshot() {
      if (!ingested || !id || !ingested.snapshotId) return;
      const versionNumber = ingested.versionNumber;
      if (versionNumber == null) return;
      if (typeof TawalaDemo === "undefined" || typeof TawalaDemo.fetchVersionSnapshot !== "function") {
        return;
      }
      const snap = await TawalaDemo.fetchVersionSnapshot(ingested.snapshotId);
      if (!snap || snap.status === "failure" || !snap.project) return;
      if (
        typeof TawalaTransfer !== "undefined" &&
        typeof TawalaTransfer.attachVersionDefinition === "function"
      ) {
        TawalaTransfer.attachVersionDefinition(id, versionNumber, snap.project, ingested.snapshotId);
        renderProject(id);
      }
    })();
  </script>
</body>
</html>
